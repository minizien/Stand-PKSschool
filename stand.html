<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ระบบออกแบบสแตน - เว็บสแตน</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #fff;
        }
        .header-bar {
            padding: 12px 20px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .header-bar h2 {
            font-size: 18px;
            color: #00d2ff;
        }
        
        .main-layout {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* แผงคลังไอเทม/ตัวละครฝั่งซ้าย (สไตล์ Minecraft Inventory เลื่อนลงได้ยาวๆ) */
        .inventory-sidebar {
            width: 160px;
            background: rgba(30, 30, 45, 0.95);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 8px;
            gap: 10px;
            z-index: 5;
            flex-shrink: 0;
        }
        .inventory-title {
            font-size: 12px;
            font-weight: bold;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 5px;
        }
        .inventory-grid {
            flex: 1;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding-right: 2px;
            align-content: start;
        }
        .inv-slot {
            aspect-ratio: 1;
            background: rgba(50, 50, 70, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .inv-slot:hover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.15);
            transform: scale(1.03);
        }
        .inv-slot.selected {
            border: 3px solid #00d2ff;
            background: rgba(0, 210, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }
        .inv-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .inv-slot span {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            font-size: 9px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 1px 2px;
            color: #fff;
        }
        .empty-hint {
            grid-column: span 2;
            font-size: 11px;
            color: #aaa;
            text-align: center;
            padding: 20px 5px;
        }

        /* ปุ่มพิกัดจัดการข้อมูล */
        .btn-db-action {
            width: 100%;
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            background: rgba(255, 152, 0, 0.2);
            border: 1px solid rgba(255, 152, 0, 0.4);
            color: #ffb74d;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-db-action:hover {
            background: rgba(255, 152, 0, 0.4);
        }

        /* พื้นที่เวิร์กสเปซตารางสแตน */
        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #12121c;
            cursor: grab;
            touch-action: none;
        }
        .workspace:active {
            cursor: grabbing;
        }
        
        #transform-wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #stand-grid-container {
            display: grid;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stand-slot {
            width: 65px;
            height: 85px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        .stand-slot:hover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
        }
        .stand-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* ปุ่มซูมลอยมุมขวาล่าง */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            background: rgba(30, 30, 45, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
        }
        .btn {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn.primary { background: linear-gradient(135deg, #007bff, #00d2ff); color: white; }
        .btn.primary:hover { opacity: 0.9; }
        .btn.secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn.secondary:hover { background: rgba(255,255,255,0.2); }
        .btn.danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; }
        .btn.danger:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>✨ ออกแบบสแตนของคุณ</h2>
        <button class="btn primary" onclick="window.location.href='index.html'">🏠 กลับหน้า Lobby</button>
    </div>

    <div class="main-layout">
        <!-- แผงคลังตัวละครฝั่งซ้าย (เลื่อนดูได้ยาวๆ เป็นร้อยเป็นพันรูป) -->
        <div class="inventory-sidebar">
            <div class="inventory-title">📦 คลังตัวละคร</div>
            <div class="inventory-grid" id="inventory-grid">
                <div class="empty-hint">กำลังโหลดข้อมูลจาก DB...</div>
            </div>
            <button class="btn-db-action" onclick="window.location.href='index.html'">➕ เพิ่มรูปใน Lobby</button>
        </div>

        <!-- พื้นที่เวิร์กสเปซสำหรับซูมและลากเลื่อน -->
        <div class="workspace" id="workspace">
            <div id="transform-wrapper">
                <div id="stand-grid-container"></div>
            </div>
        </div>
    </div>

    <!-- ปุ่มควบคุมซูมลอยมุมขวาล่าง -->
    <div class="zoom-controls">
        <button class="btn secondary" onclick="adjustZoom(0.1)" title="ซูมเข้า">➕</button>
        <button class="btn secondary" onclick="adjustZoom(-0.1)" title="ซูมออก">➖</button>
        <button class="btn danger" onclick="resetTransform()" title="รีเซ็ตตำแหน่ง">🔄 รีเซ็ต</button>
    </div>

    <!-- Script ควบคุมระบบและการดึงข้อมูล Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCXYKW4bzj0pwAtt3yPHQGXFD1TameMHyw",
          authDomain: "pksstand.firebaseapp.com",
          projectId: "pksstand",
          storageBucket: "pksstand.firebasestorage.app",
          messagingSenderId: "1009274020815",
          appId: "1:1009274020815:web:9851275ff7b6494576e8ba",
          measurementId: "G-7ZJDCRH03K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let scale = 1, panX = 0, panY = 0;
        let isDragging = false, startX = 0, startY = 0;
        let selectedCharacterImage = null; // เก็บรูปที่เลือกจากคลังซ้าย

        window.addEventListener('DOMContentLoaded', () => {
            let input = prompt("กรุณากรอกจำนวนน้องในสแตนในรูปแบบ แถว×คอลัมน์ (เช่น 9×8):", "9×8");
            let rows = 9, cols = 8;
            if (input) {
                let parts = input.toLowerCase().replace('×', 'x').split('x');
                rows = parseInt(parts[0]) || 9;
                cols = parseInt(parts[1]) || 8;
            }
            generateGrid(rows, cols);
            initPanAndZoom();
            loadInventoryFromFirebase();
        });

        // สร้างตารางสแตน
        function generateGrid(rows, cols) {
            const container = document.getElementById('stand-grid-container');
            container.style.gridTemplateColumns = `repeat(${cols}, 65px)`;
            container.style.gridTemplateRows = `repeat(${rows}, 85px)`;
            container.innerHTML = '';

            for (let i = 1; i <= rows * cols; i++) {
                const slot = document.createElement('div');
                slot.className = 'stand-slot';
                slot.dataset.id = i;
                slot.innerText = i;
                
                // เมื่อคลิกช่องสแตนให้นำรูปที่เลือกจากคลังฝั่งซ้ายมาวาง
                slot.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedCharacterImage) {
                        slot.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = selectedCharacterImage;
                        slot.appendChild(img);
                    } else {
                        alert(`ช่องที่ ${i}: กรุณาจิ้มเลือกตัวละครจากคลังซ้ายมือก่อนนำมาวางครับ!`);
                    }
                };
                container.appendChild(slot);
            }
            
            setTimeout(() => {
                centerGrid();
            }, 50);
        }

        // โหลดข้อมูลตัวละครทั้งหมดจาก Firebase มารวมไว้ที่แผงซ้าย
        async function loadInventoryFromFirebase() {
            const container = document.getElementById('inventory-grid');
            try {
                const querySnapshot = await getDocs(collection(db, "character_database"));
                container.innerHTML = '';
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-hint">
                            ยังไม่มีข้อมูล<br>ไปเพิ่มใน Lobby ก่อนครับ
                        </div>
                    `;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let slot = document.createElement('div');
                    slot.className = 'inv-slot';
                    slot.innerHTML = `
                        <img src="${data.imageBase64}" alt="${data.name}">
                        <span>${data.name}</span>
                    `;
                    
                    // เมื่อคลิกเลือกตัวละครจากคลังซ้าย
                    slot.onclick = () => {
                        document.querySelectorAll('.inv-slot').forEach(s => s.classList.remove('selected'));
                        slot.classList.add('selected');
                        selectedCharacterImage = data.imageBase64;
                    };
                    
                    container.appendChild(slot);
                });
            } catch (error) {
                console.error("Error loading inventory: ", error);
                container.innerHTML = '<div class="empty-hint" style="color:#ff416c;">โหลดข้อมูลพลาด</div>';
            }
        }

        // ระบบเลื่อนและซูมตารางสแตน
        function initPanAndZoom() {
            const workspace = document.getElementById('workspace');

            workspace.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            });
            window.addEventListener('mouseup', () => { isDragging = false; });

            workspace.addEventListener('wheel', (e) => {
                e.preventDefault();
                let zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                scale = Math.min(Math.max(0.2, scale * zoomFactor), 5);
                updateTransform();
            }, { passive: false });

            let initialDist = null;
            workspace.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            });

            workspace.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    updateTransform();
                } else if (e.touches.length === 2 && initialDist) {
                    let currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let zoomFactor = currentDist / initialDist;
                    scale = Math.min(Math.max(0.2, scale * zoomFactor), 5);
                    initialDist = currentDist;
                    updateTransform();
                }
            }, { passive: true });

            workspace.addEventListener('touchend', () => {
                isDragging = false;
                initialDist = null;
            });
        }

        window.adjustZoom = function(amount) {
            scale = Math.min(Math.max(0.2, scale + amount), 5);
            updateTransform();
        }

        window.resetTransform = function() {
            scale = 1;
            centerGrid();
        }

        function centerGrid() {
            const workspace = document.getElementById('workspace');
            const container = document.getElementById('stand-grid-container');
            
            let availableWidth = workspace.clientWidth;
            let availableHeight = workspace.clientHeight;

            panX = (availableWidth - container.offsetWidth) / 2;
            panY = (availableHeight - container.offsetHeight) / 2;
            updateTransform();
        }

        function updateTransform() {
            const wrapper = document.getElementById('transform-wrapper');
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }
    </script>
</body>
</html>
