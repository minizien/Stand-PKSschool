<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ระบบออกแบบสแตน - เว็บสแตน</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #fff;
        }
        .header-bar {
            padding: 12px 20px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .header-bar h2 {
            font-size: 18px;
            letter-spacing: 0.5px;
            color: #00d2ff;
        }
        
        .main-layout {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* แถบ UI ฝั่งซ้าย สไตล์ช่องไอเทมเกม */
        .sidebar-ui {
            width: 90px;
            background: rgba(30, 30, 45, 0.9);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            gap: 12px;
            z-index: 5;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0c0;
            margin-bottom: -4px;
        }
        .pose-slot {
            width: 60px;
            height: 60px;
            background: rgba(50, 50, 70, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .pose-slot:hover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
            transform: translateY(-2px);
        }
        .pose-slot.active {
            border: 3px solid #00d2ff;
            background: rgba(0, 210, 255, 0.2);
            color: #00d2ff;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }
        .pose-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .settings-slot {
            background: rgba(255, 152, 0, 0.2);
            border-color: rgba(255, 152, 0, 0.4);
            color: #ffb74d;
            font-size: 11px;
            font-weight: bold;
        }
        .settings-slot:hover {
            border-color: #ff9800;
            background: rgba(255, 152, 0, 0.3);
        }

        /* พื้นที่เวิร์กสเปซสำหรับซูมและลากเลื่อน */
        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #12121c;
            cursor: grab;
            touch-action: none;
        }
        .workspace:active {
            cursor: grabbing;
        }
        
        #transform-wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #stand-grid-container {
            display: grid;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stand-slot {
            width: 65px;
            height: 85px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .stand-slot:hover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
        }
        .stand-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* ปุ่มซูมลอยมุมขวาล่าง แบบเกมมิ่ง */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            background: rgba(30, 30, 45, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
        }
        .btn {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn.primary { background: linear-gradient(135deg, #007bff, #00d2ff); color: white; box-shadow: 0 4px 10px rgba(0,123,255,0.3); }
        .btn.primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn.secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn.secondary:hover { background: rgba(255,255,255,0.2); }
        .btn.danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; box-shadow: 0 4px 10px rgba(255,65,108,0.3); }
        .btn.danger:hover { opacity: 0.9; }

        /* หน้าต่าง Modal เลือกตัวละครสไตล์ Minecraft Inventory UI */
        #firebase-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e2f;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .modal-content h3 {
            color: #00d2ff;
            margin-bottom: 8px;
        }
        .character-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .char-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .char-item:hover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.15);
            transform: translateY(-2px);
        }
        .char-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .empty-db-box {
            grid-column: span 2;
            padding: 20px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>✨ ออกแบบสแตนของคุณ</h2>
        <button class="btn primary" onclick="window.location.href='index.html'">🏠 กลับหน้า Lobby</button>
    </div>

    <div class="main-layout">
        <!-- แถบ UI ฝั่งซ้าย (4 ช่องท่า + 1 ช่องตั้งค่า) -->
        <div class="sidebar-ui">
            <div class="sidebar-title">ช่องท่า</div>
            <div class="pose-slot" id="pose-0" onclick="selectPose(0)" title="ท่าที่ 1">1</div>
            <div class="pose-slot" id="pose-1" onclick="selectPose(1)" title="ท่าที่ 2">2</div>
            <div class="pose-slot" id="pose-2" onclick="selectPose(2)" title="ท่าที่ 3">3</div>
            <div class="pose-slot" id="pose-3" onclick="selectPose(3)" title="ท่าที่ 4">4</div>
            <div style="width: 100%; height: 1px; background: rgba(255,255,255,0.1); margin: 2px 0;"></div>
            <div class="pose-slot settings-slot" onclick="openFirebaseSelector()" title="เลือกจากฐานข้อมูล">⚙️ ตั้งค่า</div>
        </div>

        <!-- พื้นที่เวิร์กสเปซสำหรับซูมและลากเลื่อน -->
        <div class="workspace" id="workspace">
            <div id="transform-wrapper">
                <div id="stand-grid-container"></div>
            </div>
        </div>
    </div>

    <!-- Modal เลือกตัวละครสไตล์ Inventory เกม -->
    <div id="firebase-modal">
        <div class="modal-content">
            <h3>คลังข้อมูลตัวละคร (Database)</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">เลือกตัวละครเพื่อใส่ลงในช่องท่าทางฝั่งซ้าย</p>
            <div class="character-list" id="char-list-container">
                กำลังโหลดข้อมูลจาก Firebase...
            </div>
            <button class="btn danger" onclick="closeFirebaseSelector()" style="width: 100%; margin-top: 10px;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- ปุ่มควบคุมซูมลอยมุมขวาล่าง -->
    <div class="zoom-controls">
        <button class="btn secondary" onclick="adjustZoom(0.1)" title="ซูมเข้า">➕</button>
        <button class="btn secondary" onclick="adjustZoom(-0.1)" title="ซูมออก">➖</button>
        <button class="btn danger" onclick="resetTransform()" title="รีเซ็ตตำแหน่ง">🔄 รีเซ็ต</button>
    </div>

    <!-- เรียกใช้งาน Firebase SDK และ Script ควบคุม -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCXYKW4bzj0pwAtt3yPHQGXFD1TameMHyw",
          authDomain: "pksstand.firebaseapp.com",
          projectId: "pksstand",
          storageBucket: "pksstand.firebasestorage.app",
          messagingSenderId: "1009274020815",
          appId: "1:1009274020815:web:9851275ff7b6494576e8ba",
          measurementId: "G-7ZJDCRH03K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let scale = 1, panX = 0, panY = 0;
        let isDragging = false, startX = 0, startY = 0;
        let poses = [null, null, null, null];
        let selectedPoseIndex = null;
        let targetSlotForSelection = 0;
        let gridRows = 9, gridCols = 8;

        window.addEventListener('DOMContentLoaded', () => {
            let input = prompt("กรุณากรอกจำนวนน้องในสแตนในรูปแบบ แถว×คอลัมน์ (เช่น 9×8):", "9×8");
            if (input) {
                let parts = input.toLowerCase().replace('×', 'x').split('x');
                gridRows = parseInt(parts[0]) || 9;
                gridCols = parseInt(parts[1]) || 8;
            }
            generateGrid(gridRows, gridCols);
            initPanAndZoom();
        });

        function generateGrid(rows, cols) {
            const container = document.getElementById('stand-grid-container');
            container.style.gridTemplateColumns = `repeat(${cols}, 65px)`;
            container.style.gridTemplateRows = `repeat(${rows}, 85px)`;
            container.innerHTML = '';

            for (let i = 1; i <= rows * cols; i++) {
                const slot = document.createElement('div');
                slot.className = 'stand-slot';
                slot.dataset.id = i;
                slot.innerText = i;
                
                slot.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedPoseIndex !== null && poses[selectedPoseIndex]) {
                        slot.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = poses[selectedPoseIndex];
                        slot.appendChild(img);
                    } else {
                        alert(`ช่องที่ ${i}: กรุณาเลือกท่าจากแถบซ้ายมือก่อนคลิกวาง`);
                    }
                };
                container.appendChild(slot);
            }
            
            setTimeout(() => {
                centerGrid();
            }, 50);
        }

        window.selectPose = function(index) {
            document.querySelectorAll('.pose-slot').forEach((el, idx) => {
                if(idx < 4) el.classList.remove('active');
            });

            if (!poses[index]) {
                alert(`ช่องท่าที่ ${index + 1} ยังว่างอยู่ กรุณากดปุ่ม "⚙️ ตั้งค่า" เพื่อดึงรูปจาก Firebase มาใส่`);
                selectedPoseIndex = null;
                return;
            }

            selectedPoseIndex = index;
            document.getElementById(`pose-${index}`).classList.add('active');
        }

        window.openFirebaseSelector = async function() {
            let slotNum = prompt("ต้องการใส่รูปลงในช่องท่าทางช่องไหน (1 - 4):", "1");
            let idx = parseInt(slotNum) - 1;
            if (idx >= 0 && idx < 4) {
                targetSlotForSelection = idx;
                document.getElementById('firebase-modal').style.display = 'flex';
                await loadCharactersFromFirebase();
            } else if (slotNum !== null) {
                alert("กรุณาระบุตัวเลขระหว่าง 1 ถึง 4 ครับ");
            }
        }

        window.closeFirebaseSelector = function() {
            document.getElementById('firebase-modal').style.display = 'none';
        }

        async function loadCharactersFromFirebase() {
            const container = document.getElementById('char-list-container');
            container.innerHTML = '<p style="grid-column: span 2; color: #aaa;">กำลังโหลดข้อมูล...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "character_database"));
                container.innerHTML = '';
                
                // ตรวจสอบว่าถ้าไม่มีข้อมูลในระบบ ให้แสดงปุ่มกลับหน้า Lobby ไปเพิ่มข้อมูลเอง
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-db-box">
                            <p style="margin-bottom: 15px; color: #ffb74d;">⚠️ ยังไม่มีข้อมูลตัวละครในระบบฐานข้อมูล</p>
                            <button class="btn primary" onclick="window.location.href='index.html'">ไปเพิ่มข้อมูลที่หน้า Lobby</button>
                        </div>
                    `;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let div = document.createElement('div');
                    div.className = 'char-item';
                    div.innerHTML = `
                        <img src="${data.imageBase64}" alt="${data.name}">
                        <div style="font-size: 12px; font-weight: bold; color: #fff; text-align: center;">${data.name}</div>
                    `;
                    div.onclick = () => {
                        poses[targetSlotForSelection] = data.imageBase64;
                        const slotUI = document.getElementById(`pose-${targetSlotForSelection}`);
                        slotUI.innerHTML = `<img src="${data.imageBase64}" title="${data.name}">`;
                        closeFirebaseSelector();
                        selectPose(targetSlotForSelection);
                    };
                    container.appendChild(div);
                });
            } catch (error) {
                console.error("Error loading characters: ", error);
                container.innerHTML = '<p style="color: #ff416c; grid-column: span 2;">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
            }
        }

        // ระบบเลื่อนและซูม
        function initPanAndZoom() {
            const workspace = document.getElementById('workspace');

            workspace.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            });
            window.addEventListener('mouseup', () => { isDragging = false; });

            workspace.addEventListener('wheel', (e) => {
                e.preventDefault();
                let zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                scale = Math.min(Math.max(0.2, scale * zoomFactor), 5);
                updateTransform();
            }, { passive: false });

            let initialDist = null;
            workspace.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            });

            workspace.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    updateTransform();
                } else if (e.touches.length === 2 && initialDist) {
                    let currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    let zoomFactor = currentDist / initialDist;
                    scale = Math.min(Math.max(0.2, scale * zoomFactor), 5);
                    initialDist = currentDist;
                    updateTransform();
                }
            }, { passive: true });

            workspace.addEventListener('touchend', () => {
                isDragging = false;
                initialDist = null;
            });
        }

        window.adjustZoom = function(amount) {
            scale = Math.min(Math.max(0.2, scale + amount), 5);
            updateTransform();
        }

        window.resetTransform = function() {
            scale = 1;
            centerGrid();
        }

        function centerGrid() {
            const workspace = document.getElementById('workspace');
            const container = document.getElementById('stand-grid-container');
            
            let availableWidth = workspace.clientWidth;
            let availableHeight = workspace.clientHeight;

            panX = (availableWidth - container.offsetWidth) / 2;
            panY = (availableHeight - container.offsetHeight) / 2;
            updateTransform();
        }

        function updateTransform() {
            const wrapper = document.getElementById('transform-wrapper');
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }
    </script>
</body>
</html>
