<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - เว็บสแตน</title>
    <!-- แยกไฟล์ CSS ออกมาเรียกใช้งานภายนอก -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lobby-container">
        <h1>Lobby เว็บสแตน</h1>
        <p>ยินดีต้อนรับเข้าสู่ระบบจัดการและสร้างสแตน</p>
        
        <div class="button-group">
            <!-- ปุ่มที่ 1: กดสร้างสแตน (เด้งไปหน้า stand.html) -->
            <button id="btn-create" class="btn primary">กดสร้างสแตน</button>
            
            <!-- ปุ่มที่ 2: กดบวกฐานข้อมูล (อัปโหลดรูปและชื่อเข้าระบบ Firebase) -->
            <button id="btn-database" class="btn secondary">กดบวกฐานข้อมูล</button>
            
            <!-- ปุ่มที่ 3: แจ้งบัค / รายงานปัญหา (ส่งข้อมูลไป Firebase) -->
            <button id="btn-bug" class="btn danger">แจ้งบัค / รายงานปัญหา</button>
        </div>
    </div>

    <!-- Modal สำหรับอัปโหลดรูปภาพและตั้งชื่อ (ทำงานร่วมกับปุ่มที่ 2) -->
    <div id="upload-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:white; padding:30px; border-radius:10px; width:90%; max-width:350px; text-align:center;">
            <h3>เพิ่มข้อมูลรูปภาพตัวละคร</h3>
            <input type="text" id="char-name" placeholder="ชื่อเรียกท่าทาง" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <input type="file" id="char-image" accept="image/*" style="width:100%; margin-bottom:15px;">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="btn-save-upload" class="btn primary" style="padding: 10px 15px; font-size: 14px;">บันทึก</button>
                <button id="btn-close-upload" class="btn danger" style="padding: 10px 15px; font-size: 14px;">ยกเลิก</button>
            </div>
        </div>
    </div>

    <!-- แยกไฟล์ JavaScript ออกมาเรียกใช้งานภายนอกแบบ Module -->
    <script type="module" src="script.js"></script>
</body>
</html>
