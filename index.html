<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - เว็บสแตน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lobby-container">
        <h1>Lobby เว็บสแตน</h1>
        <p>ยินดีต้อนรับเข้าสู่ระบบจัดการและสร้างสแตน</p>
        
        <div class="button-group">
            <!-- ปุ่มกดสร้าง เด้งไปหน้า stand.html -->
            <button id="btn-create" class="btn primary">กดสร้างสแตน</button>
            
            <!-- ปุ่มบวกฐานข้อมูล (เชื่อมต่อ Firebase ใน script.js) -->
                <!-- กล่องสำหรับอัปโหลดรูปภาพและตั้งชื่อ (ซ่อนไว้ก่อนจนกว่าจะกดปุ่มบวกฐานข้อมูล) -->
    <div id="upload-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:10px; width:90%; max-width:350px; text-align:center;">
            <h3>เพิ่มข้อมูลรูปภาพตัวละคร</h3>
            <input type="text" id="char-name" placeholder="ชื่อเรียกตัวละคร/น้อง" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <input type="file" id="char-image" accept="image/*" style="width:100%; margin-bottom:15px;">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="btn-save-upload" class="btn primary">บันทึก</button>
                <button id="btn-close-upload" class="btn danger">ยกเลิก</button>
            </div>
        </div>
    </div>

            <!-- ปุ่มแจ้งบัค (ส่งข้อมูลเข้า Firebase ใน script.js) -->
            <button id="btn-bug" class="btn danger">แจ้งบัค / รายงานปัญหา</button>
        </div>
    </div>

    <!-- นำเข้า Firebase SDK และ Script หลัก -->
    <script type="module" src="script.js"></script>
</body>
</html>
